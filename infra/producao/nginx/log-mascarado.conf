# Access log sem tokens. Contexto http (vhost de borda no Laradock e conf.d do nginx do container web).
# Mascara o token de convite e de redefinição de senha (no caminho) e os parâmetros ?convite= e email= (na query).
# O Referer vai como "-" porque ele carregaria a URL anterior, com token.
map $request_uri $gab_u1 {
    default $request_uri;
    ~^(?<gab_p1>/responsavel/convite/)[^/?]+(?<gab_r1>.*)$ "${gab_p1}[oculto]${gab_r1}";
}
map $gab_u1 $gab_u2 {
    default $gab_u1;
    ~^(?<gab_p2>/(?:responsavel/)?redefinir-senha/)[^/?]+(?<gab_r2>.*)$ "${gab_p2}[oculto]${gab_r2}";
}
map $gab_u2 $gab_u3 {
    default $gab_u2;
    ~^(?<gab_p3>[^?]*\?(?:[^#]*&)?convite=)[^&]*(?<gab_r3>.*)$ "${gab_p3}[oculto]${gab_r3}";
}
map $gab_u3 $gabaritu_uri_mascarada {
    default $gab_u3;
    ~^(?<gab_p4>[^?]*\?(?:[^#]*&)?email=)[^&]*(?<gab_r4>.*)$ "${gab_p4}[oculto]${gab_r4}";
}

log_format gabaritu_mascarado '$remote_addr - $remote_user [$time_local] '
    '"$request_method $gabaritu_uri_mascarada $server_protocol" $status $body_bytes_sent '
    '"-" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
