# FASE 1 (antes do certificado): só atende o desafio HTTP-01. Instalar em /app/laradock/nginx/sites/gabaritu.conf.
server {
    listen 80;
    listen [::]:80;
    server_name gabaritu.gorilash.com.br;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/gabaritu-acme;
    }

    location / { return 404; }
}
