# FASE 2 (certificado emitido): vhost definitivo no nginx do LARADOCK (compartilhado: `nginx -t` SEMPRE antes do reload).
# O X-Forwarded-For é sobrescrito com o IP do cliente; o Laravel só confia nele via TRUSTED_PROXIES.
server {
    listen 80;
    listen [::]:80;
    server_name gabaritu.gorilash.com.br;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/gabaritu-acme;
    }

    location / { return 301 https://gabaritu.gorilash.com.br$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gabaritu.gorilash.com.br;

    ssl_certificate     /etc/nginx/ssl/gabaritu/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/gabaritu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/gabaritu-access.log gabaritu_mascarado;
    error_log  /var/log/nginx/gabaritu-error.log;

    # Só no nível do server: add_header em location apagaria os herdados.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Report-Only até a revisão: fontes e JS saem do próprio domínio (Vite build, fontes Bunny hospedadas pelo plugin);
    # 'unsafe-inline' só em style (o <style> das fontes e style="" do Vue). Para impor, trocar o nome do header.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 5m;

    # Resolver + variável: o nginx compartilhado não cai se o gabaritu estiver fora do ar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gabaritu_upstream http://gabaritu-web:80;

    location / {
        proxy_pass $gabaritu_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
