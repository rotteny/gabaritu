# nginx interno (só public/ + FastCGI). TLS e cabeçalhos de segurança ficam no nginx de borda do Laradock.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 5m;
    server_tokens off;

    location ~ /\.(?!well-known) { deny all; }

    location / { try_files $uri /index.php?$query_string; }

    location /build/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Variável no fastcgi_pass: o nginx reresolve o app a cada 10 s (o app pode ser recriado com outro IP).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /index.php {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ { return 404; }
}
