; Sobrescreve o pool www da imagem (carrega depois do www.conf, em ordem alfabética).
; Teto de RAM: 20 workers x ~40 MB privados cabe no mem_limit do app (compose.yaml).
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
