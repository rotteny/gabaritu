name: gabaritu

# Logs do Docker: 14 arquivos de 5 MB (teto por tamanho; o json-file não rotaciona por idade).
x-logging: &logging
    driver: json-file
    options: { max-size: '5m', max-file: '14' }

services:
    db:
        image: postgres:18.6-trixie
        restart: unless-stopped
        logging: *logging
        networks: [internal]
        mem_limit: 384m
        shm_size: 64m
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        command:
            [
                'postgres',
                '-c',
                'shared_buffers=64MB',
                '-c',
                'max_connections=30',
            ]
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 5s
            timeout: 3s
            retries: 20

    app:
        image: gabaritu-app:${APP_TAG:-current}
        build:
            { context: ., dockerfile: infra/producao/Dockerfile, target: app }
        env_file: .env
        restart: unless-stopped
        logging: *logging
        networks: [internal]
        mem_limit: 256m
        volumes:
            - imagens:/var/www/html/public/conteudo/img
        depends_on:
            db: { condition: service_healthy }

    # Mesma imagem e mesmo .env do app. Roda o gabaritu:limpar-pendentes (routes/console.php).
    scheduler:
        image: gabaritu-app:${APP_TAG:-current}
        command: ['php', 'artisan', 'schedule:work']
        env_file: .env
        restart: unless-stopped
        logging: *logging
        networks: [internal]
        mem_limit: 128m
        depends_on:
            db: { condition: service_healthy }

    gabaritu-web:
        image: gabaritu-web:${APP_TAG:-current}
        logging: *logging
        build:
            { context: ., dockerfile: infra/producao/Dockerfile, target: web }
        restart: unless-stopped
        networks:
            internal: {}
            edge: { aliases: [gabaritu-web] }
        mem_limit: 64m
        volumes:
            - imagens:/var/www/html/public/conteudo/img:ro
        depends_on: [app]
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q -O /dev/null http://127.0.0.1/up || exit 1',
                ]
            interval: 15s
            timeout: 5s
            retries: 5

networks:
    internal: {}
    edge:
        external: true
        name: laradock_backend

volumes:
    pgdata: {}
    imagens: {}
